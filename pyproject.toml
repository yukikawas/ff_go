[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ff-go"
version = "1.0.0"
description = "调用 FFmpeg 的照片 / 视频 / 音频批量处理工具，零第三方依赖"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "yuki sui" }]
keywords = ["ffmpeg", "media", "compress", "convert", "batch"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
ff-go = "ff_go.cli:main"

[project.urls]
Homepage = "https://github.com/TinQlo/ff_go"

[tool.setuptools]
packages = ["ff_go", "ff_go.ops"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]

[tool.mypy]
python_version = "3.9"
strict = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
